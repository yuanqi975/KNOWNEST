  <text x="1032" y="279" class="mono" font-size="10" fill="#0f756e">01 / JAVA DATE.DOCX</text><text x="1032" y="314" class="ui" font-size="13" fill="#2e5050">“LocalDate 表示不带时间的日期，</text><text x="1032" y="339" class="ui" font-size="13" fill="#2e5050">适合生日、账期等场景。”</text><rect x="1032" y="366" width="72" height="22" rx="11" fill="#d9efe8"/><text x="1068" y="381" text-anchor="middle" class="ui" font-size="10" fill="#0f756e">相关度 92%</text>
