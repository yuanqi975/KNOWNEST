  <text x="308" y="317" class="ui" font-size="16" fill="#294b4b">这份文档主要讲了什么？</text><line x1="308" y1="343" x2="996" y2="343" stroke="#e4eee9"/><text x="308" y="374" class="mono" font-size="10" fill="#78918b">基于检索片段生成 · 3 个相关片段</text><circle cx="968" cy="366" r="21" fill="#b9e1d7"/><text x="968" y="373" text-anchor="middle" class="ui" font-size="19" fill="#0d655e">↑</text>
  <text x="278" y="458" class="mono" font-size="11" letter-spacing="2" fill="#458c83">RAG ANSWER / 01</text><text x="278" y="499" class="ui" font-size="22" font-weight="750" fill="#173c42">Java Date.docx 主要介绍了什么？</text><text x="278" y="539" class="ui" font-size="15" fill="#496562">这份资料围绕 Java 的日期与时间 API 展开，涵盖日期对象、格式化方式，以及常见的使用场景。</text><text x="278" y="568" class="ui" font-size="15" fill="#496562">回答只引用当前知识库中能定位到的内容。</text>
