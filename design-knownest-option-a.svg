  <rect x="1095" y="230" width="312" height="157" rx="12" fill="#fff" stroke="#d6e6df"/><text x="1119" y="261" class="mono" font-size="10" fill="#0f756e">01 / JAVA DATE.DOCX</text><text x="1119" y="295" class="ui" font-size="13" fill="#2e5050">“LocalDate 表示不带时间的日期，</text><text x="1119" y="320" class="ui" font-size="13" fill="#2e5050">适合生日、账期等场景。”</text><rect x="1119" y="343" width="72" height="22" rx="11" fill="#e0f2ed"/><text x="1155" y="358" text-anchor="middle" class="ui" font-size="10" fill="#0f756e">相关度 92%</text>
