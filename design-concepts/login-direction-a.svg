<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">WeKnora login concept, direction A</title>
  <desc id="desc">A dark knowledge rail and a calm login workspace with username, password, local runtime status, sign in, and first-run workspace setup.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faf8"/>
      <stop offset="1" stop-color="#e6f1ed"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9eee8"/>
      <stop offset="1" stop-color="#f6faf7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#103337" flood-opacity=".13"/>
    </filter>
    <style>
      .ui{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#ground)"/>

  <rect width="330" height="900" fill="#0b2b32"/>
  <circle cx="54" cy="52" r="24" fill="#78d1bf"/>
  <text x="54" y="60" text-anchor="middle" class="ui" font-size="20" font-weight="800" fill="#0b2b32">W</text>
  <text x="92" y="58" class="ui" font-size="17" font-weight="800" letter-spacing="3.4" fill="#f1f8f4">WEKNORA</text>
  <text x="92" y="78" class="mono" font-size="9" letter-spacing="1.6" fill="#91b2aa">PRIVATE KNOWLEDGE RUNTIME</text>
  <line x1="34" y1="122" x2="296" y2="122" stroke="#24484e"/>

  <text x="34" y="198" class="mono" font-size="11" letter-spacing="2" fill="#77c9b8">PRIVATE BY DESIGN</text>
  <text x="34" y="254" class="ui" font-size="31" font-weight="760" fill="#f3f8f5">Your knowledge,</text>
  <text x="34" y="294" class="ui" font-size="31" font-weight="760" fill="#f3f8f5">ready to reason with.</text>
  <text x="34" y="350" class="ui" font-size="15" fill="#9dbbb4">Bring documents together, then ask</text>
  <text x="34" y="376" class="ui" font-size="15" fill="#9dbbb4">questions with inspectable evidence.</text>

  <g transform="translate(34 468)">
    <rect width="262" height="58" rx="10" fill="#143d43" stroke="#2b5d5d"/>
    <circle cx="28" cy="29" r="9" fill="#78d1bf"/>
    <text x="52" y="35" class="ui" font-size="14" fill="#e2f0eb">Document-grounded answers</text>
  </g>
  <g transform="translate(34 540)">
    <rect width="262" height="58" rx="10" fill="#143d43" stroke="#2b5d5d"/>
    <path d="M20 30l7 7 14-18" fill="none" stroke="#78d1bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="35" class="ui" font-size="14" fill="#e2f0eb">Citations you can open</text>
  </g>
  <g transform="translate(34 612)">
    <rect width="262" height="58" rx="10" fill="#143d43" stroke="#2b5d5d"/>
    <path d="M20 36c3-18 27-18 30 0M21 36h28" fill="none" stroke="#78d1bf" stroke-width="2.6" stroke-linecap="round"/>
    <text x="52" y="35" class="ui" font-size="14" fill="#e2f0eb">Bounded agent research</text>
  </g>
  <line x1="34" y1="814" x2="296" y2="814" stroke="#24484e"/>
  <text x="34" y="850" class="mono" font-size="10" letter-spacing="1.6" fill="#719890">LOCAL RUNTIME / NO CLOUD ACCOUNT</text>

  <text x="380" y="52" class="ui" font-size="13" fill="#5e7c76">Welcome to WeKnora</text>
  <g transform="translate(1316 30)">
    <circle cx="10" cy="10" r="5" fill="#3fb69f"/>
    <text x="24" y="15" class="ui" font-size="12" fill="#4c716b">Local runtime ready</text>
  </g>

  <rect x="380" y="98" width="1162" height="706" rx="26" fill="url(#wash)"/>
  <circle cx="532" cy="190" r="82" fill="#c9e8df" opacity=".66"/>
  <circle cx="610" cy="294" r="44" fill="#b4ded3" opacity=".8"/>
  <circle cx="498" cy="366" r="20" fill="#6bc6b3" opacity=".68"/>
  <path d="M448 446h244" stroke="#9ccfc3" stroke-width="2"/>
  <circle cx="448" cy="446" r="7" fill="#0d776e"/>
  <circle cx="529" cy="446" r="7" fill="#75c9ba"/>
  <circle cx="610" cy="446" r="7" fill="#a7d9ce"/>
  <circle cx="692" cy="446" r="7" fill="#d0e9e2"/>
  <text x="448" y="486" class="mono" font-size="10" letter-spacing="1.7" fill="#5a8981">COLLECT  /  CONNECT  /  ASK  /  GROW</text>

  <rect x="850" y="148" width="566" height="606" rx="18" fill="#ffffff" stroke="#d4e5df" filter="url(#shadow)"/>
  <text x="902" y="206" class="mono" font-size="11" letter-spacing="2" fill="#428b80">WELCOME BACK</text>
  <text x="902" y="258" class="ui" font-size="34" font-weight="760" fill="#15393d">Sign in to WeKnora</text>
  <text x="902" y="294" class="ui" font-size="15" fill="#708b85">Continue to your private knowledge workspace.</text>

  <text x="902" y="358" class="ui" font-size="13" font-weight="700" fill="#496b64">Username</text>
  <rect x="902" y="374" width="462" height="54" rx="9" fill="#f8fbf9" stroke="#bfd6cf"/>
  <text x="922" y="408" class="ui" font-size="15" fill="#9aafa9">Enter your username</text>

  <text x="902" y="470" class="ui" font-size="13" font-weight="700" fill="#496b64">Password</text>
  <rect x="902" y="486" width="462" height="54" rx="9" fill="#f8fbf9" stroke="#bfd6cf"/>
  <text x="922" y="520" class="ui" font-size="15" fill="#9aafa9">Enter your password</text>
  <path d="M1320 513c-8-12-20-18-31-18s-23 6-31 18c8 12 20 18 31 18s23-6 31-18z" fill="none" stroke="#6f938b" stroke-width="1.8"/>
  <circle cx="1289" cy="513" r="5" fill="none" stroke="#6f938b" stroke-width="1.8"/>

  <rect x="902" y="578" width="462" height="54" rx="10" fill="#0d756c"/>
  <text x="1133" y="612" text-anchor="middle" class="ui" font-size="15" font-weight="760" fill="#ffffff">Sign in</text>
  <text x="1364" y="612" text-anchor="end" class="ui" font-size="20" fill="#b6e2d8">→</text>

  <line x1="902" y1="674" x2="1364" y2="674" stroke="#e1ece7"/>
  <text x="1133" y="716" text-anchor="middle" class="ui" font-size="14" fill="#5e8179">First run? Create your workspace</text>
  <circle cx="1082" cy="712" r="3" fill="#64bcae"/>

  <text x="380" y="850" class="mono" font-size="10" letter-spacing="1.4" fill="#7a9a92">AUTHENTICATION  /  USERNAME + PASSWORD  /  JWT SESSION</text>
</svg>
