  <text x="448" y="434" fill="#514337" font-family="Georgia,Microsoft YaHei,serif" font-size="17">当前策略以固定大小作为主约束，遇到标题或段落边界时才会提前收束。</text><text x="448" y="463" fill="#514337" font-family="Georgia,Microsoft YaHei,serif" font-size="17">如果原文没有清晰结构，单个 chunk 就可能被推到上限，读起来显得很长。</text>
