  <text x="424" y="395" fill="#8fc29c" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12" font-weight="700">知识库回答</text><text x="424" y="434" fill="#d5e3d8" font-family="Georgia,Microsoft YaHei,serif" font-size="17">先识别标题与段落层级，再用 chunk size 作为软上限，而不是唯一规则。</text><text x="424" y="463" fill="#d5e3d8" font-family="Georgia,Microsoft YaHei,serif" font-size="17">对没有结构的页面，启用递归分隔和 overlap，可以避免上下文被硬切断。</text>
