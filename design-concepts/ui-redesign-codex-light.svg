  <text x="424" y="395" fill="#648875" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12" font-weight="700">知识库回答</text>
  <text x="424" y="434" fill="#35453b" font-family="Georgia,Microsoft YaHei,serif" font-size="17">长篇报告建议优先使用自动策略，让系统根据标题、章节和分页结构</text><text x="424" y="463" fill="#35453b" font-family="Georgia,Microsoft YaHei,serif" font-size="17">选择切分器；结构稳定时，也可以固定为“按标题结构”，并保留适度 overlap。</text>
