  <rect x="442" y="232" width="820" height="84" rx="8" fill="#fffdf9" stroke="#dedfd5"/><text x="472" y="271" class="ui" font-size="15">智能回答和普通 RAG 有什么区别？</text><text x="472" y="296" class="ui muted" font-size="12">已保留在当前会话中，可继续追问</text>
