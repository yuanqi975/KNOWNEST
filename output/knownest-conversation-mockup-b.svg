  <line x1="34" y1="558" x2="326" y2="558" class="line"/><text x="34" y="598" class="ui muted" font-size="13">工作空间</text><text x="34" y="638" class="ui" font-size="15">▤　文档</text><text x="300" y="638" class="ui muted">6</text><text x="34" y="680" class="ui" font-size="15">▣　知识库</text><text x="34" y="722" class="ui" font-size="15">⚙　设置与记忆</text><text x="34" y="764" class="ui" font-size="15">▦　MCP 管理</text>
  <rect x="360" width="1080" height="64" fill="#fffdf9"/><line x1="360" y1="64" x2="1440" y2="64" class="line"/><text x="400" y="39" class="ui muted">知识库 / tets / 对话记录</text><text x="1262" y="39" class="ui muted">● 系统运行中</text>
