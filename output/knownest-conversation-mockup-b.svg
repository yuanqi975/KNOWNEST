<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <style>
    .ui{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#405c58}.muted{fill:#83928b}.line{stroke:#dedfd5;stroke-width:1}.icon{fill:none;stroke:#55736c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.label{font-size:14px;font-weight:600}
