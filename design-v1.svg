<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7f2"/>
      <stop offset="1" stop-color="#eef5f2"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e1f2ee"/>
      <stop offset="1" stop-color="#f4f8f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0d2933" flood-opacity=".10"/>
    </filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- sidebar -->
  <rect width="250" height="900" fill="#0d2730"/>
  <circle cx="46" cy="48" r="22" fill="#73d2c0"/>
  <text x="46" y="56" text-anchor="middle" class="sans" font-size="19" font-weight="800" fill="#0d2730">K</text>
  <text x="80" y="43" class="sans" font-size="15" font-weight="800" letter-spacing="3.2" fill="#f4f7f3">KNOWNEST</text>
  <text x="80" y="62" class="mono" font-size="9" letter-spacing="2" fill="#91afa9">PRIVATE KNOWLEDGE RUNTIME</text>
  <line x1="28" y1="104" x2="222" y2="104" stroke="#294851"/>
  <text x="28" y="137" class="sans" font-size="11" fill="#88a9a3">工作空间</text>
  <rect x="22" y="153" width="206" height="46" rx="8" fill="#183b43" stroke="#35615f"/>
  <text x="38" y="181" class="sans" font-size="14" fill="#f2f6f2">Personal workspace</text>
  <text x="202" y="181" class="sans" font-size="18" fill="#76cbbb">⌄</text>
  <text x="28" y="231" class="sans" font-size="12" fill="#75d1bf">＋ 新建工作空间</text>
  <text x="28" y="283" class="sans" font-size="11" fill="#88a9a3">知识库</text>
  <rect x="22" y="299" width="206" height="46" rx="8" fill="#183b43" stroke="#35615f"/>
  <text x="38" y="327" class="sans" font-size="14" fill="#f2f6f2">test</text>
  <text x="202" y="327" class="sans" font-size="18" fill="#76cbbb">⌄</text>
  <text x="28" y="377" class="sans" font-size="12" fill="#75d1bf">＋ 新建知识库</text>
  <text x="28" y="429" class="sans" font-size="11" fill="#88a9a3">最近打开</text>
  <rect x="22" y="446" width="206" height="42" rx="8" fill="#75d1bf"/>
  <text x="40" y="472" class="sans" font-size="13" font-weight="700" fill="#0d2730">⌁  Java Date.docx</text>
  <text x="28" y="523" class="sans" font-size="13" fill="#d0e4df">＋ 上传文档</text>
  <line x1="28" y1="805" x2="222" y2="805" stroke="#294851"/>
  <text x="28" y="839" class="sans" font-size="12" fill="#8db0aa">设置</text>
  <text x="28" y="869" class="sans" font-size="12" fill="#8db0aa">帮助与快捷键</text>
  <!-- top bar -->
  <rect x="250" width="1350" height="72" fill="#fbfcf9"/>
  <line x1="250" y1="72" x2="1600" y2="72" stroke="#dfe8e3"/>
  <text x="284" y="44" class="sans" font-size="13" fill="#617b78">知识库  /  test</text>
  <circle cx="1434" cy="35" r="5" fill="#4cbca5"/>
  <text x="1450" y="40" class="sans" font-size="12" fill="#476864">系统运行中</text>
  <text x="1542" y="40" class="sans" font-size="12" fill="#476864">退出</text>
  <!-- main -->
  <rect x="250" y="72" width="930" height="828" fill="url(#bg)"/>
  <rect x="282" y="110" width="866" height="188" rx="18" fill="url(#hero)"/>
  <text x="320" y="151" class="mono" font-size="11" letter-spacing="2" fill="#4b8a82">ASK YOUR KNOWLEDGE BASE</text>
  <text x="320" y="207" class="sans" font-size="38" font-weight="700" fill="#102f35">让文档，变成可对话的答案。</text>
  <text x="320" y="243" class="sans" font-size="15" fill="#5d7774">输入一个问题，KNOWNEST 会从你的资料中找到依据。</text>
  <rect x="905" y="145" width="196" height="52" rx="26" fill="#0d6f69"/>
  <text x="1003" y="177" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#ffffff">开始探索  →</text>
  <!-- composer -->
  <rect x="282" y="326" width="866" height="130" rx="16" fill="#ffffff" stroke="#d8e5df" filter="url(#shadow)"/>
  <text x="312" y="362" class="sans" font-size="14" fill="#91a4a0">你的问题</text>
  <text x="312" y="402" class="sans" font-size="17" fill="#294a4b">这份文档主要讲了什么？</text>
  <line x1="312" y1="421" x2="1118" y2="421" stroke="#e6eeea"/>
  <text x="312" y="444" class="mono" font-size="11" fill="#7a9690">⌘ ENTER 发送问题</text>
  <circle cx="1095" cy="419" r="24" fill="#b9ded5"/>
  <text x="1095" y="426" text-anchor="middle" class="sans" font-size="20" fill="#0d5d59">↑</text>
  <!-- answer -->
  <text x="282" y="506" class="mono" font-size="11" letter-spacing="2" fill="#4b8a82">ANSWER  /  01</text>
  <text x="282" y="546" class="sans" font-size="22" font-weight="700" fill="#173c42">Java Date.docx 主要介绍了什么？</text>
  <text x="282" y="584" class="sans" font-size="15" fill="#496462">这份资料围绕 Java 中的日期与时间 API 展开，</text>
  <text x="282" y="612" class="sans" font-size="15" fill="#496462">涵盖日期对象、格式化方式，以及常见的使用场景。</text>
  <line x1="282" y1="644" x2="1148" y2="644" stroke="#dce8e3"/>
  <text x="282" y="682" class="sans" font-size="13" fill="#0d6f69">查看引用来源  ↗</text>
  <text x="1025" y="682" class="sans" font-size="13" fill="#80938f">生成于 0.8s</text>
  <!-- evidence rail -->
  <rect x="1180" y="72" width="420" height="828" fill="#f9fbf8" stroke="#dfe8e3"/>
  <text x="1218" y="118" class="mono" font-size="11" letter-spacing="2" fill="#4b8a82">EVIDENCE</text>
  <text x="1218" y="148" class="sans" font-size="20" font-weight="700" fill="#173c42">回答依据</text>
  <text x="1218" y="176" class="sans" font-size="13" fill="#78908c">1 个文档 · 3 个相关片段</text>
  <line x1="1218" y1="202" x2="1563" y2="202" stroke="#dfe8e3"/>
  <rect x="1218" y="228" width="345" height="166" rx="12" fill="#ffffff" stroke="#d8e5df"/>
  <text x="1242" y="260" class="mono" font-size="11" fill="#0d6f69">01  /  JAVA DATE.DOCX</text>
  <text x="1242" y="295" class="sans" font-size="14" fill="#2c4b4c">“LocalDate 表示不带时间的日期，</text>
  <text x="1242" y="321" class="sans" font-size="14" fill="#2c4b4c">适合用于生日、账期等场景。”</text>
  <rect x="1242" y="348" width="74" height="24" rx="12" fill="#e1f2ee"/>
  <text x="1279" y="365" text-anchor="middle" class="sans" font-size="11" fill="#0d6f69">相关度 92%</text>
  <rect x="1218" y="416" width="345" height="132" rx="12" fill="#ffffff" stroke="#d8e5df"/>
  <text x="1242" y="448" class="mono" font-size="11" fill="#0d6f69">02  /  JAVA DATE.DOCX</text>
  <text x="1242" y="483" class="sans" font-size="14" fill="#2c4b4c">“DateTimeFormatter 用于定义</text>
  <text x="1242" y="509" class="sans" font-size="14" fill="#2c4b4c">日期与文本之间的格式转换。”</text>
  <text x="1242" y="534" class="sans" font-size="11" fill="#8ba19c">相关度 86%</text>
  <text x="1218" y="610" class="sans" font-size="13" fill="#0d6f69">打开完整文档  ↗</text>
  <text x="1218" y="838" class="mono" font-size="10" letter-spacing="1" fill="#94aaa5">KNOWNEST  /  PRIVATE KNOWLEDGE RUNTIME</text>
</svg>
